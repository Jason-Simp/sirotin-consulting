services:
  - type: web
    name: sirotin-consulting
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NEXT_PUBLIC_SITE_URL
        value: https://automatemejay.com
      - key: NEXT_PUBLIC_CONSULTATION_BOOKING_URL
        value: https://calendar.google.com/calendar/appointments/schedules/AcZssZ0lVz4Ms-gCu6Lih6OaMA48D_Uv9-CsRAjf-XUZqHExVVZX4KOabqb7dJl74DgQ-LSGfcEiLhyp
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_GUARANTEED_WEEK_PRICE_ID
        sync: false
      - key: STRIPE_MONTHLY_PRICE_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: RESEND_FROM_EMAIL
        value: Jason Sirotin <hello@automatemejay.com>
      - key: RESEND_REPLY_TO
        value: hello@automatemejay.com
      - key: JASON_NOTIFICATION_EMAIL
        value: hello@automatemejay.com
      - key: NEXT_PUBLIC_ELEVENLABS_AGENT_ID
        sync: false
      - key: AGENT_TOOL_SECRET
        sync: false
      - key: SECURITY_RATE_LIMIT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_ID
        sync: false
      - key: GOOGLE_CALENDAR_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_REFRESH_TOKEN_SIMPLSOLUTIONS
        sync: false
      - key: GOOGLE_CALENDAR_REFRESH_TOKEN_ECG
        sync: false
      - key: GOOGLE_CALENDAR_ID_SIMPLSOLUTIONS
        value: jason@simplsolutions.app
      - key: GOOGLE_CALENDAR_ID_ECG
        value: sirotin@ecgprod.com
      - key: GOOGLE_CALENDAR_BOOKING_ID
        value: jason@simplsolutions.app
